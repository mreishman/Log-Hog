name: Update release notes wiki

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v9.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: loghog-wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: release
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      WIKI_URL: https://github.com/mreishman/Log-Hog.wiki.git
    steps:
      - name: Verify published release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Update the version section in the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          : "${WIKI_TOKEN:?Set WIKI_TOKEN to a credential with write access to the wiki}"
          encoded=$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)
          echo "::add-mask::$encoded"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$WIKI_URL.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $encoded"
          wiki="$RUNNER_TEMP/loghog-wiki"
          git clone --depth 1 "$WIKI_URL" "$wiki"
          python3 -B scripts/release_notes.py wiki "${TAG#v}" --wiki-file "$wiki/Change-Log---Release-Notes.md"
          if git -C "$wiki" diff --quiet -- Change-Log---Release-Notes.md; then
            echo "Wiki notes already match $TAG"
            exit 0
          fi
          git -C "$wiki" add -- Change-Log---Release-Notes.md
          git -C "$wiki" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Add Log-Hog $TAG release notes"
          git -C "$wiki" push origin HEAD
