ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html">
    Options -Indexes
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
</Directory>

<DirectoryMatch "^/var/www/html/(config|session|tmp|local/conf)(/|$)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/html/local/(profiles/[^/]+|default)/conf(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
